<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mira tortilla club</title>
  <meta name="description" content="We press tortillas in small batches in Lisboa. Join the mira tortilla club and we'll be in touch when the next batch is ready.">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#b9cfe4">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Archivo+Black&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #141412; --cream: #f4eee1; --cream-dim: #e9e0cc;
      --oxblood: #6e2f2f; --sky: #b9cfe4; --masa: #ecd9af; --toast: #b98a4e;
      --font-display: "Space Grotesk", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-display); background: var(--sky); color: var(--ink);
      min-height: 100svh; display: grid; place-items: center; padding: 1.2rem;
      overflow-x: hidden;
    }
    .card {
      background: var(--cream); border: 3px solid var(--ink); border-radius: 20px;
      box-shadow: 8px 9px 0 rgba(20,20,18,.3); max-width: 430px; width: 100%;
      padding: 1.8rem 1.5rem 1.5rem; position: relative;
      animation: cardIn .5s cubic-bezier(.2, 1.4, .4, 1) both;
    }
    @keyframes cardIn { from { opacity: 0; transform: scale(.92) translateY(14px); } }
    /* floating sticker dots, like the hero's €8! stickers */
    .stick {
      position: absolute; font-family: "Archivo Black", var(--font-display);
      display: grid; place-items: center; border-radius: 50%; border: 3px solid var(--ink);
      box-shadow: 3px 4px 0 rgba(20,20,18,.28); transform: rotate(-9deg);
      animation: bob 3.4s ease-in-out infinite;
    }
    .stick--1 { width: 62px; height: 62px; background: var(--oxblood); color: var(--cream); font-size: .8rem; top: -20px; right: -12px; }
    .stick--2 { width: 48px; height: 48px; background: var(--masa); color: var(--ink); font-size: .62rem; bottom: 34px; left: -14px; transform: rotate(8deg); animation-delay: 1.1s; }
    @keyframes bob { 50% { translate: 0 -6px; } }
    /* wordmark + h1 form one lockup: the script IS the "mira" in "mira tortilla club" */
    .wordmark { height: 46px; display: block; margin: 0 auto .1rem; animation: wob .5s .15s cubic-bezier(.2,1.6,.4,1) both; }
    @keyframes wob { from { opacity: 0; transform: rotate(-5deg) scale(.7); } }
    .club-kicker {
      font-family: var(--font-mono); font-size: .72rem; letter-spacing: .16em;
      text-transform: uppercase; text-align: center; opacity: .65; margin-bottom: 1.1rem;
    }
    h1 {
      font-family: "Archivo Black", var(--font-display); font-size: clamp(1.7rem, 7vw, 2.2rem);
      line-height: 1.02; text-align: center; text-transform: lowercase; margin-bottom: .25rem;
    }
    h1 .club { color: var(--oxblood); }
    .h1-pt { font-family: var(--font-mono); text-align: center; font-size: .74rem; opacity: .55; margin-bottom: 1.1rem; }
    .intro {
      font-size: .88rem; line-height: 1.5; text-align: center; margin: .7rem 0 1rem;
      animation: rowIn .45s .18s both;
    }
    .perk-hit {
      font-family: var(--font-mono); font-size: .82rem; text-align: center;
      background: var(--masa); border: 2px solid var(--ink); border-radius: 999px;
      padding: .5rem .9rem; margin-bottom: 1.2rem;
      animation: rowIn .45s .3s both;
    }
    .perk-hit span { font-weight: 500; color: var(--oxblood); }
    .perks { list-style: none; margin-bottom: 1.3rem; }
    .perks li {
      font-size: .92rem; line-height: 1.35; padding: .55rem .1rem;
      border-top: 2px solid var(--cream-dim); display: flex; gap: .6rem; align-items: baseline;
      animation: rowIn .45s both;
    }
    .perks li:nth-child(1) { animation-delay: .18s; }
    .perks li:nth-child(2) { animation-delay: .30s; }
    .perks li:nth-child(3) { animation-delay: .42s; }
    @keyframes rowIn { from { opacity: 0; transform: translateX(-14px); } }
    .perks li:last-child { border-bottom: 2px solid var(--cream-dim); }
    .perks .pt { display: block; font-size: .74rem; opacity: .55; font-family: var(--font-mono); }
    .perks .dot { color: var(--oxblood); font-weight: 700; font-family: var(--font-mono); }
    form { display: grid; gap: .6rem; }
    input, .btn {
      width: 100%; font-size: 1rem; border-radius: 12px; padding: .8rem .9rem;
      font-family: var(--font-mono); box-sizing: border-box;
    }
    input { border: 2px solid var(--ink); background: #fff; color: var(--ink); transition: transform .12s; }
    input::placeholder { color: #8a8577; }
    input:focus { outline: 3px solid var(--oxblood); transform: rotate(-.4deg) scale(1.01); }
    .hint { font-size: .7rem; font-family: var(--font-mono); opacity: .6; text-align: center; margin: .1rem 0 -.1rem; }
    .btn {
      background: var(--ink); color: var(--cream); border: 2px solid var(--ink);
      font-weight: 700; letter-spacing: .04em; text-transform: uppercase; cursor: pointer;
      margin-top: .3rem; transition: transform .08s;
    }
    .btn:hover { animation: jiggle .35s; }
    @keyframes jiggle { 25% { transform: rotate(-1.2deg); } 75% { transform: rotate(1.2deg); } }
    .btn:active { transform: translate(2px, 2px); }
    .btn[disabled] { opacity: .6; }
    .err { display: none; color: var(--oxblood); font-family: var(--font-mono); font-size: .78rem; }
    .legal {
      font-size: .6rem; font-family: var(--font-mono); opacity: .42; line-height: 1.5;
      margin-top: 1.1rem; text-align: center;
    }
    .legal a { color: inherit; }
    /* success state */
    .done { display: none; text-align: center; padding: .6rem 0 .3rem; }
    .done.on { display: block; animation: cardIn .45s cubic-bezier(.2, 1.4, .4, 1) both; }
    .done .num {
      font-family: "Archivo Black", var(--font-display); font-size: 3.4rem; line-height: 1;
      color: var(--oxblood); margin: .4rem 0 .2rem;
    }
    .done .lbl { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; opacity: .65; }
    .done h2 { font-family: "Archivo Black", var(--font-display); font-size: 1.6rem; text-transform: lowercase; margin-bottom: .2rem; }
    .done p { font-size: .9rem; line-height: 1.45; margin-top: .7rem; }
    /* NB: must be `.done .hello` — a bare `.hello` loses to `.done p` on specificity. */
    .done .hello {
      font-family: "Archivo Black", var(--font-display); font-size: 1.15rem;
      text-transform: lowercase; margin-top: .8rem; margin-bottom: -.35rem;
    }
    /* their name keeps its capital — it's the one word here that isn't brand copy */
    .done .hello b { font-weight: inherit; text-transform: none; }
    .done .pt { font-size: .76rem; opacity: .6; font-family: var(--font-mono); margin-top: .5rem; }
    .site-link { display: inline-block; margin-top: 1.1rem; font-family: var(--font-mono); font-size: .8rem; color: var(--ink); }
    .signin-line {
      font-family: var(--font-mono); font-size: .74rem; text-align: center;
      margin-top: .9rem; opacity: .7;
    }
    .signin-line a { color: var(--oxblood); text-underline-offset: .2em; }
    .foot-note {
      font-family: var(--font-mono); font-size: .66rem; text-align: center;
      opacity: .5; margin-top: .8rem; letter-spacing: .04em;
    }
    .langbtn {
      position: absolute; top: .8rem; right: .9rem; z-index: 2;
      font-family: var(--font-mono); font-size: .7rem; letter-spacing: .08em;
      background: none; border: 2px solid var(--ink); border-radius: 999px;
      padding: .25rem .6rem; cursor: pointer; color: var(--ink); opacity: .75;
    }
    .langbtn:hover { opacity: 1; }
    /* confetti */
    .cf {
      position: fixed; top: -20px; border-radius: 50%; pointer-events: none; z-index: 50;
      animation: fall linear forwards;
    }
    @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
  </style>
</head>
<body>
  <main class="card">
    <button class="langbtn mono" id="langBtn" type="button" aria-label="mudar idioma">PT</button>
    <img class="wordmark" src="assets/mira-wordmark.png" alt="mira">
    <div id="joinView">
      <h1>tortilla <span class="club">club</span></h1>
      <p class="intro" data-t="intro">for people who want tortillas</p>
      <form id="clubForm" autocomplete="on">
        <input id="cHp" name="website" tabindex="-1" aria-hidden="true" autocomplete="off"
               style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none">
        <input id="cName" name="name" autocomplete="name" placeholder="name" data-tp="name">
        <input id="cEmail" name="email" type="email" autocomplete="email" placeholder="email" data-tp="email">
        <input id="cPhone" name="phone" type="tel" autocomplete="tel" placeholder="phone" data-tp="phone">
        <p class="hint" data-t="hint">no spam, just tortillas</p>
        <div class="err" id="cErr"></div>
        <button class="btn" id="cBtn" type="submit" data-t="join">join</button>
      </form>
      <p class="legal">
        <span data-t="legal">email or WhatsApp</span> · <a href="/privacy" data-t="privacy">privacy</a>
      </p>
    </div>

    <!-- already signed in: recognise them instead of asking them to join again -->
    <div class="done" id="memberView">
      <!-- "tortilla club" only: the wordmark above already says mira, and the
           join screen's <h1> is set the same way. Still reads mira tortilla club. -->
      <p class="club-kicker">tortilla club</p>
      <p class="hello" id="doneHello" hidden></p>
      <p data-t="touch">we'll email you when there's tortillas.</p>
      <a class="site-link" href="/account">your account &amp; points →</a>
    </div>

    <div class="done" id="doneView">
      <!-- "tortilla club" only: the wordmark above already says mira, and the
           join screen's <h1> is set the same way. Still reads mira tortilla club. -->
      <p class="club-kicker">tortilla club</p>
      <p class="hello" id="joinHello" hidden></p>
      <p data-t="touch">we'll email you when there's tortillas.</p>
      <a class="site-link" href="https://instagram.com/miratortillas" target="_blank" rel="noopener" data-t="follow">follow @miratortillas →</a>
    </div>

  </main>

  <script>
    (function () {
      /* two languages, auto-picked from the phone, one tap to switch */
      var T = {
        en: {
          intro: "for people who want tortillas",
          name: "name", email: "email", phone: "phone",
          hint: "no spam, just tortillas", join: "join",
          legal: "we'll only write to you about tortillas", privacy: "privacy", follow: "follow @miratortillas →",
          already: "already a member?", signin: "sign in",
          touch: "we'll email you when there's tortillas.",
          greet_in: "you're in", greet_again: "you're already in",
          back: "que bom ver-te outra vez.", other: "PT",
        },
        pt: {
          intro: "para quem quer tortillas",
          name: "nome", email: "email", phone: "telemóvel",
          hint: "sem spam, só tortillas", join: "entrar",
          legal: "só falamos contigo sobre tortillas", privacidade: "privacidade", privacy: "privacidade", follow: "segue @miratortillas →",
          already: "já és membro?", signin: "entrar",
          touch: "escrevemos-te quando houver tortillas.",
          greet_in: "estás dentro", greet_again: "já estás dentro",
          back: "que bom ver-te outra vez.", other: "EN",
        },
      };
      var lang = (localStorage.getItem("mira-lang") ||
                  ((navigator.language || "").toLowerCase().indexOf("pt") === 0 ? "pt" : "en"));
      function apply() {
        var d = T[lang];
        document.querySelectorAll("[data-t]").forEach(function (el) {
          var k = el.getAttribute("data-t"); if (d[k]) el.textContent = d[k];
        });
        document.querySelectorAll("[data-tp]").forEach(function (el) {
          var k = el.getAttribute("data-tp"); if (d[k]) el.placeholder = d[k];
        });
        /* The greeting is built in JS, so it has no data-t to translate. It carries
           its key + the name instead, and gets re-rendered here on every toggle. */
        document.querySelectorAll("[data-greet]").forEach(function (el) {
          var k = el.getAttribute("data-greet");
          var n = el.getAttribute("data-name") || "";
          if (!d[k] || !n) return;
          el.innerHTML = d[k] + ", <b>" + n.replace(/[&<>"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          }) + "</b>";
        });
        document.getElementById("langBtn").textContent = d.other;
        document.documentElement.lang = lang;
        window.__miraClubLang = lang;
      }
      /* second IIFE sets the name, then asks for a re-render in the current lang */
      window.__miraGreet = function (el, key, name) {
        var f = (name || "").trim().split(/\s+/)[0] || "";
        if (!f) return;
        el.setAttribute("data-greet", key);
        el.setAttribute("data-name", f.charAt(0).toUpperCase() + f.slice(1).toLowerCase());
        el.hidden = false;
        apply();
      };
      document.getElementById("langBtn").addEventListener("click", function () {
        lang = lang === "pt" ? "en" : "pt";
        try { localStorage.setItem("mira-lang", lang); } catch (e) {}
        apply();
      });
      apply();
    })();
    (function () {
      var greet = window.__miraGreet;

      /* ONBOARDING STATE 1: already signed in → recognise them, don't ask again */
      fetch("/api/me", { credentials: "same-origin" })
        .then(function (r) { return r.json(); })
        .then(function (me) {
          if (!me || !me.loggedIn || !me.customer || !me.customer.clubNo) return;
          greet(document.getElementById("doneHello"), "greet_again", me.customer.name);
          document.getElementById("joinView").style.display = "none";
          document.getElementById("memberView").classList.add("on");
        })
        .catch(function () { /* not signed in — join form stays */ });

      var form = document.getElementById("clubForm");
      var err = document.getElementById("cErr");
      var btn = document.getElementById("cBtn");
      var src = new URLSearchParams(location.search).get("s") || "web";
      function showErr(m) { err.textContent = m; err.style.display = "block"; }

      function confetti() {
        var colors = ["#6e2f2f", "#ecd9af", "#141412", "#f4eee1", "#b98a4e"];
        for (var i = 0; i < 42; i++) {
          var d = document.createElement("div");
          d.className = "cf";
          var s = 6 + Math.random() * 9;
          d.style.width = d.style.height = s + "px";
          d.style.left = Math.random() * 100 + "vw";
          d.style.background = colors[i % colors.length];
          d.style.animationDuration = 1.6 + Math.random() * 1.8 + "s";
          d.style.animationDelay = Math.random() * 0.5 + "s";
          if (i % 3 === 0) d.style.borderRadius = "2px"; /* mix squares in */
          document.body.appendChild(d);
          setTimeout(function (el) { return function () { el.remove(); }; }(d), 4200);
        }
      }


      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var name = document.getElementById("cName").value.trim();
        var email = document.getElementById("cEmail").value.trim();
        var phone = document.getElementById("cPhone").value.trim();
        var hp = document.getElementById("cHp").value;
        if (!email) return showErr(window.__miraClubLang === "pt" ? "escreve o teu email" : "add your email");
        if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return showErr("invalid email");
        if (phone && phone.replace(/[^0-9]/g, "").length < 6) return showErr("invalid phone");
        err.style.display = "none";
        btn.disabled = true; btn.textContent = "joining…";
        fetch("/api/club-join", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: name, email: email, phone: phone, src: src, hp: hp,
            lang: window.__miraClubLang || "en" }),
        }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { r: r, d: d }; }); })
          .then(function (x) {
            if (!x.r.ok || !x.d.ok) throw new Error(x.d.error || "");
            document.getElementById("joinView").style.display = "none";
            var dv = document.getElementById("doneView");
            /* STATE 2: returning member → greet them back, don't pretend it's new.
               The difference lives in this one line; the body copy stays the same. */
            greet(document.getElementById("joinHello"),
              x.d.again ? "greet_again" : "greet_in", name);
            dv.classList.add("on");
            if (!x.d.again) confetti(); /* confetti is for actually joining */
          })
          .catch(function (e2) {
            btn.disabled = false; btn.textContent = (window.__miraClubLang === "pt" ? "entrar" : "join");
            showErr((e2 && e2.message) || "didn't work, try again");
          });
      });
    })();
  </script>
</body>
</html>
